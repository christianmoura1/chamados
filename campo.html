<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acompanhamento Diário Campo — Sul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --sidebar:   #1E1B3A;
    --sidebar-2: #2A2555;
    --ground:    #F3F1FB;
    --surface:   #FFFFFF;
    --surface2:  #F6F4FC;
    --ink:       #211D3D;
    --muted:     #726E93;
    --faint:     #A9A5C6;
    --line:      #ECEAF6;
    --violet:    #7C5CFC;
    --violet-2:  #A78BFA;
    --pink:      #F472B6;
    --blue:      #38BDF8;
    --sos:       #E43F5A;
    --sos-soft:  rgba(228,63,90,0.10);
    --alta:      #F5A623;
    --alta-soft: rgba(245,166,35,0.12);
    --ok:        #22C08D;
    --grid:      rgba(33,29,61,0.06);
    --shadow:    0 1px 2px rgba(33,29,61,.04), 0 12px 28px rgba(33,29,61,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #100E22; --surface: #1A1733; --surface2: #211D42;
      --ink: #ECEAFB; --muted: #A29DC7; --faint: #6C6791; --line: #2C2854;
      --violet: #9A82FF; --violet-2: #C4B5FD; --pink: #F9A8D4; --blue: #7DD3FC;
      --sos: #F3697F; --sos-soft: rgba(243,105,127,0.16);
      --alta: #FBBF56; --alta-soft: rgba(251,191,86,0.16); --ok: #4ADE9E;
      --grid: rgba(236,234,251,0.07); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 32px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"] {
    --ground:   #100E22; --surface: #1A1733; --surface2: #211D42;
    --ink: #ECEAFB; --muted: #A29DC7; --faint: #6C6791; --line: #2C2854;
    --violet: #9A82FF; --violet-2: #C4B5FD; --pink: #F9A8D4; --blue: #7DD3FC;
    --sos: #F3697F; --sos-soft: rgba(243,105,127,0.16);
    --alta: #FBBF56; --alta-soft: rgba(251,191,86,0.16); --ok: #4ADE9E;
    --grid: rgba(236,234,251,0.07); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 32px rgba(0,0,0,.32);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .shell { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: 100vh; transition: grid-template-columns .22s ease; }
  .shell.sb-collapsed { grid-template-columns: 0 minmax(0,1fr); }
  @media (max-width: 860px) { .shell:not(.sb-expanded) { grid-template-columns: 0 minmax(0,1fr); } }

  .side {
    background: linear-gradient(180deg, var(--sidebar), var(--sidebar-2));
    padding: 26px 20px; display: flex; flex-direction: column; gap: 30px; color: #EDEAFF;
    position: relative; overflow: hidden; white-space: nowrap; min-width: 0;
    transition: opacity .18s ease;
  }
  .shell.sb-collapsed .side { opacity: 0; padding-left: 0; padding-right: 0; }

  .side-toggle {
    position: absolute; top: 22px; right: 14px; width: 26px; height: 26px; border-radius: 999px;
    background: rgba(255,255,255,0.08); border: none; color: #C6C0EE; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; flex: none;
  }
  .side-toggle:hover { background: rgba(255,255,255,0.16); color: #FFFFFF; }

  .side-reopen {
    display: none; position: fixed; top: 22px; left: 18px; z-index: 40;
    width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); box-shadow: var(--shadow); cursor: pointer;
    align-items: center; justify-content: center; font-size: 15px; line-height: 1;
  }
  .side-reopen:hover { color: var(--violet); }
  .shell.sb-collapsed .side-reopen { display: flex; }

  .brand { display: flex; align-items: center; gap: 11px; padding-right: 24px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-family: "Archivo", sans-serif; font-weight: 800; font-size: 15px; color: white; flex: none;
  }
  .brand .name { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .brand .sub { font-size: 11px; color: #A79FE0; }

  .navgroup { display: flex; flex-direction: column; gap: 3px; }
  .navlabel { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #7A72B8; padding: 0 12px; margin: 14px 0 6px; }
  .navitem {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px;
    color: #C6C0EE; font-size: 13.5px; font-weight: 500; text-decoration: none;
  }
  a.navitem:hover { background: rgba(255,255,255,0.06); color: #FFFFFF; }
  .navitem .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; opacity: .55; flex: none; }
  .navitem.active { background: rgba(255,255,255,0.08); color: #FFFFFF; }
  .navitem.active .dot { background: var(--pink); opacity: 1; }

  .side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11.5px; color: #8B84C4; }

  .main { padding: clamp(18px,3vw,34px) clamp(16px,3.5vw,40px) 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); margin: 0 0 6px; }
  h1 { font-family: "Archivo", sans-serif; font-weight: 800; font-size: clamp(24px,3.4vw,32px); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .stamp-pill {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; box-shadow: var(--shadow);
  }

  .kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 13px; margin: 22px 0 30px; }
  @media (max-width: 1080px) { .kpis { grid-template-columns: repeat(2,1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 17px 14px; box-shadow: var(--shadow); }
  .kpi .label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display:block; margin-bottom: 7px; }
  .kpi .val { font-family: "Archivo", sans-serif; font-weight: 800; font-size: clamp(20px,2.6vw,25px); letter-spacing: -0.01em; }
  .kpi.k-sos .val { color: var(--sos); }
  .kpi.k-alta .val { color: var(--alta); }
  .kpi.k-violet .val { color: var(--violet); }
  .kpi.k-ok .val { color: var(--ok); }

  section { margin-top: 34px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 15px; flex-wrap: wrap; }
  h2 { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin: 0; }
  .sec-note { font-size: 12px; color: var(--faint); font-family: "IBM Plex Mono", monospace; }

  .equip-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .equip-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
  @media (max-width: 640px) { .equip-grid { grid-template-columns: minmax(0,1fr); } }

  .ecard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; text-align: left; }
  .ecard:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(33,29,61,.08), 0 18px 34px rgba(33,29,61,.10); }
  .ecard:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .ecard .ehead { display: flex; align-items: center; justify-content: space-between; }
  .ecard .etitle { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 14.5px; }
  .ecard .eopen { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); }

  .donut-row { display: flex; align-items: center; gap: 16px; }
  .donut-wrap { position: relative; width: 92px; height: 92px; flex: none; }
  .donut-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut-wrap .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-wrap .pctv { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 17px; }
  .donut-wrap .pctl { font-family: "IBM Plex Mono", monospace; font-size: 8.5px; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }

  .estats { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .estat { background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
  .estat .n { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 16px; }
  .estat .l { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .estat.crit .n { color: var(--sos); }
  .estat.ok .n { color: var(--ok); }

  .esos-label { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .esos-label::before { content: "●"; font-size: 8px; }
  .esos-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .esos-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; }
  .esos-item .loja { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .esos-empty { font-size: 11.5px; color: var(--faint); }

  .cons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 780px) { .cons-grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 16px; box-shadow: var(--shadow); }
  .card h3 { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 13.5px; margin: 0 0 14px; }
  .hbar-row { display: grid; grid-template-columns: 108px 1fr 40px; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 12px; }
  .hbar-row .lbl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-track { background: var(--surface2); border-radius: 999px; height: 9px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 999px; }
  .hbar-row .v { text-align: right; font-family: "IBM Plex Mono", monospace; font-weight: 600; }

  footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .msg-carregando, .msg-erro { padding: 40px 0; text-align: center; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .msg-erro { color: var(--sos); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(16,14,34,0.55); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-panel {
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
    width: min(560px, 100%); max-height: min(640px, 88vh); display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); flex: none; }
  .modal-head h3 { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 16.5px; margin: 0; }
  .modal-close {
    appearance: none; border: none; background: var(--surface2); color: var(--muted); width: 30px; height: 30px;
    border-radius: 999px; font-size: 17px; line-height: 1; cursor: pointer;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-sub { padding: 12px 22px 0; font-size: 12px; color: var(--faint); font-family: "IBM Plex Mono", monospace; flex: none; }
  .modal-body { overflow: auto; padding: 14px 22px 20px; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .detail-table th {
    text-align: left; font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--faint); padding: 8px 10px; position: sticky; top: 0; background: var(--surface);
  }
  .detail-table td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  .detail-table tr:hover td { background: var(--surface2); }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .tag-sos { background: var(--sos-soft); color: var(--sos); }
  .tag-normal { background: var(--surface2); color: var(--muted); }
  .filter-table-wrap { max-height: 420px; overflow: auto; border-radius: 12px; }
  .filter-empty { padding: 24px 0; text-align: center; color: var(--faint); font-size: 12.5px; }
  .risco-subhead { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; font-family: "Archivo", sans-serif; font-weight: 700; font-size: 14px; }
  .risco-subhead .cnt { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
  .risco-subhead .cnt.vencido { background: var(--sos-soft); color: var(--sos); }
  .risco-subhead .cnt.avencer { background: var(--ok); color: white; }
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .filter-field { display: flex; flex-direction: column; gap: 4px; min-width: 168px; }
  .filter-field label {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
  }
  .filter-field select {
    font-family: "IBM Plex Sans", sans-serif; font-size: 13px; color: var(--ink); background: var(--surface2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; appearance: none; width: 100%;
  }
  .resp-select {
    font-family: "IBM Plex Sans", sans-serif; font-size: 12.5px; color: var(--ink); background: var(--surface2);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 7px; min-width: 118px; cursor: pointer;
  }
  .resp-select:focus { outline: 2px solid var(--violet); outline-offset: -1px; }
  .prev-date {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink); background: var(--surface2);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 7px; min-width: 128px; cursor: pointer;
  }
  .prev-date:focus { outline: 2px solid var(--violet); outline-offset: -1px; }
</style>
<style>
  /* ---------- cards de status do Acompanhamento Diario Campo ---------- */
  .statcards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 26px; }
  @media (max-width: 1100px) { .statcards { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 680px)  { .statcards { grid-template-columns: repeat(2, 1fr); } }
  .statcard { background: var(--card, #fff); border-radius: 16px; padding: 0 0 18px; overflow: hidden;
              box-shadow: 0 1px 2px rgba(20,16,60,.06), 0 8px 24px rgba(20,16,60,.05); text-align: center; }
  .statcard .cap { display: block; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .09em;
                   text-transform: uppercase; color: #fff; padding: 9px 10px; font-weight: 600; }
  .statcard .val { display: block; font-family: "Archivo", sans-serif; font-weight: 800; font-size: 40px;
                   line-height: 1; padding-top: 18px; color: var(--ink, #1a1836); }
  .sc-exec .cap { background: #E5352B; }
  .sc-token .cap { background: #F0A31B; }
  .sc-feito .cap { background: #22A15B; }
  .sc-canc .cap { background: #8C8AA3; }
  .sc-imp .cap { background: #151329; }

  .tbl-wrap { overflow-x: auto; border-radius: 14px; box-shadow: 0 1px 2px rgba(20,16,60,.06), 0 8px 24px rgba(20,16,60,.05); background: #fff; }
  table.campo { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 1180px; }
  table.campo th { background: #F6F5FC; color: #4a4770; text-align: left; font-weight: 600; white-space: nowrap;
                   font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
                   padding: 11px 12px; border-bottom: 1px solid #E7E4F5; position: sticky; top: 0; }
  table.campo td { padding: 10px 12px; border-bottom: 1px solid #F0EEF9; vertical-align: top; }
  table.campo tbody tr:hover { background: #FAF9FE; }
  table.campo tr.tem-impacto { background: #FFF5F4; }
  table.campo tr.tem-impacto:hover { background: #FFECEA; }
  table.campo tr.encerrado td { color: #8d8ba6; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .p-exec { background: #FDECEB; color: #B22119; }
  .p-and  { background: #FFF3DF; color: #9A6407; }
  .p-feito{ background: #E6F6ED; color: #14713E; }
  .p-canc { background: #EFEFF4; color: #63617a; }
  .wo { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: #4b31c9; white-space: nowrap; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .fbtn { border: 1px solid #E0DCF2; background: #fff; border-radius: 999px; padding: 7px 15px; font-size: 12.5px;
          font-weight: 600; color: #4a4770; cursor: pointer; font-family: inherit; }
  .fbtn.on { background: #4b31c9; border-color: #4b31c9; color: #fff; }
  td.t-velho { color: #B22119; font-weight: 700; }
  /* ---------- evolucao: abertos x fechados ---------- */
  .evo { background:#fff; border-radius:16px; padding:18px 20px 12px;
         box-shadow:0 1px 2px rgba(20,16,60,.06), 0 8px 24px rgba(20,16,60,.05); margin-bottom:26px; }
  .evo-top { display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .evo-leg { display:flex; gap:16px; font-size:12px; color:#4a4770; font-weight:600; }
  .evo-leg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .evo-saldo { font-family:"IBM Plex Mono",monospace; font-size:12px; color:#63617a; }
  .evo-saldo b { font-family:"Archivo",sans-serif; font-size:15px; }
  .evo-pos { color:#B22119; }
  .evo-neg { color:#14713E; }
  .aviso { background: #FFF8E6; border: 1px solid #F3E2B0; border-radius: 12px; padding: 12px 14px;
           font-size: 12.5px; color: #6b5412; margin-bottom: 20px; line-height: 1.5; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <button class="side-toggle" id="sideToggle" type="button" aria-label="Recolher menu">&lsaquo;</button>
    <div class="brand">
      <div class="mark">Z</div>
      <div><div class="name">Manutenção Sul</div><div class="sub">Zamp · BK Brasil</div></div>
    </div>
    <div class="navgroup">
      <a class="navitem" href="index.html"><span class="dot"></span>Backlog</a>
      <a class="navitem" href="tecnicos.html"><span class="dot"></span>Técnicos</a>
      <div class="navlabel">Painéis</div>
      <div class="navitem"><span class="dot"></span>Perda de Receita</div>
      <a class="navitem" href="risco.html"><span class="dot"></span>Gestão de Risco</a>
      <a class="navitem active" href="campo.html"><span class="dot"></span>Acompanhamento Campo</a>
      <div class="navlabel">Fonte</div>

  </aside>
  <button class="side-reopen" id="sideReopen" type="button" aria-label="Abrir menu">&rsaquo;</button>

  <main class="main">
    <div class="topbar">
      <div>
        <p class="eyebrow">Regional Sul · Chamados Críticos</p>
        <h1>Acompanhamento Diário Campo</h1>
      </div>
      <div class="stamp-pill" id="stamp">carregando…</div>
    </div>
    <div id="conteudo"><div class="msg-carregando">carregando data/campo.json…</div></div>
  </main>
</div>

<script>
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// datas do SOMA chegam como "16/09/2026 12:08:15"
function dataCurta(s) {
  if (!s) return '—';
  const m = String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2})/);
  return m ? `${m[1]}/${m[2]} ${m[4]}` : String(s);
}
// tempo em aberto contado de verdade (minuto a minuto), nao em dias corridos
function tempoAberto(s) {
  const m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4]), Number(m[5]));
  const min = Math.max(0, Math.floor((Date.now() - d.getTime()) / 60000));
  if (min < 60) return min + 'min';
  const h = Math.floor(min / 60), r = min % 60;
  if (h < 24) return r ? h + 'h ' + r + 'min' : h + 'h';
  const dias = Math.floor(h / 24), hr = h % 24;
  return hr ? dias + 'd ' + hr + 'h' : dias + 'd';
}
// acima de 24h o chamado ja passou do dia: destaca
function classeTempo(s) {
  const m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (!m) return '';
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4]), Number(m[5]));
  return (Date.now() - d.getTime()) >= 86400000 ? ' t-velho' : '';
}
function pillStatus(status, grupo) {
  const cls = grupo === 'executado' ? 'p-feito' : grupo === 'cancelado' ? 'p-canc'
            : /andamento/i.test(status) ? 'p-and' : 'p-exec';
  return `<span class="pill ${cls}">${esc(status || '—')}</span>`;
}

let DADOS = null;

function cards(r) {
  const c = [
    ['sc-exec',  'Em Execução',           r.emExecucao],
    ['sc-token', 'Aguardando Token',      r.aguardandoToken],
    ['sc-feito', 'Executados',            r.executados],
    ['sc-canc',  'Cancelados',            r.cancelados],
    ['sc-imp',   'Chamados com Impacto',  r.comImpacto == null ? '—' : r.comImpacto],
  ];
  return `<div class="statcards">${c.map(([k, rot, v]) =>
    `<div class="statcard ${k}"><span class="cap">${rot}</span><span class="val">${v}</span></div>`).join('')}</div>`;
}

function grafEvolucao(serie) {
  if (!Array.isArray(serie) || !serie.length) return '';
  const W = 900, H = 210, padL = 34, padB = 34, padT = 12;
  const n = serie.length;
  const maxV = Math.max(1, ...serie.map((d) => Math.max(d.abertos, d.fechados)));
  const faixa = (W - padL - 10) / n;
  const larg = Math.min(16, faixa / 2.6);
  const alt = (v) => (H - padT - padB) * (v / maxV);
  const base = H - padB;

  const barras = serie.map((d, i) => {
    const x = padL + faixa * i + faixa / 2;
    const ha = alt(d.abertos), hf = alt(d.fechados);
    const dia = d.data.slice(8, 10) + '/' + d.data.slice(5, 7);
    return `
      <g>
        <rect x="${(x - larg - 1.5).toFixed(1)}" y="${(base - ha).toFixed(1)}" width="${larg}" height="${ha.toFixed(1)}" rx="3" fill="#E5352B"></rect>
        <rect x="${(x + 1.5).toFixed(1)}" y="${(base - hf).toFixed(1)}" width="${larg}" height="${hf.toFixed(1)}" rx="3" fill="#22A15B"></rect>
        ${d.abertos ? `<text x="${(x - larg / 2 - 1.5).toFixed(1)}" y="${(base - ha - 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#B22119">${d.abertos}</text>` : ''}
        ${d.fechados ? `<text x="${(x + larg / 2 + 1.5).toFixed(1)}" y="${(base - hf - 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#14713E">${d.fechados}</text>` : ''}
        <text x="${x.toFixed(1)}" y="${base + 15}" text-anchor="middle" font-size="9.5" fill="#8d8ba6" font-family="IBM Plex Mono, monospace">${dia}</text>
      </g>`;
  }).join('');

  const grade = [0, 0.5, 1].map((f) => {
    const y = base - (H - padT - padB) * f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - 6}" y2="${y.toFixed(1)}" stroke="#EFEDF8"></line>
            <text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#a7a5bb" font-family="IBM Plex Mono, monospace">${Math.round(maxV * f)}</text>`;
  }).join('');

  const somaA = serie.reduce((t, d) => t + d.abertos, 0);
  const somaF = serie.reduce((t, d) => t + d.fechados, 0);
  const saldo = somaA - somaF;
  const cls = saldo > 0 ? 'evo-pos' : 'evo-neg';
  const txt = saldo > 0 ? 'acumulando ' + saldo : saldo < 0 ? 'reduzindo ' + Math.abs(saldo) : 'empatado';

  return `<div class="evo">
    <div class="evo-top">
      <div class="evo-leg">
        <span><i style="background:#E5352B"></i>Abertos</span>
        <span><i style="background:#22A15B"></i>Fechados</span>
      </div>
      <div class="evo-saldo">${somaA} abertos &middot; ${somaF} fechados &middot; saldo <b class="${cls}">${txt}</b></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="210" role="img" aria-label="Abertos por dia contra fechados por dia">
      ${grade}${barras}
      <line x1="${padL}" y1="${base}" x2="${W - 6}" y2="${base}" stroke="#DCD8EE"></line>
    </svg>
  </div>`;
}

function linhas(itens) {
  if (!itens.length) return `<div class="filter-empty">Nenhum chamado crítico nesse recorte.</div>`;
  return `<div class="tbl-wrap"><table class="campo">
    <thead><tr>
      <th>Número</th><th>Marca</th><th>Regional</th><th>Setor</th><th>Loja</th>
      <th>Status</th><th>Fase</th><th>Abertura</th><th>Em aberto</th><th>Fechamento</th>
      <th>Principal</th><th>Secundário</th><th>Tarefa</th>
    </tr></thead><tbody>
    ${itens.map((i) => {
      return `<tr>
        <td class="wo">${esc(i.numero)}</td>
        <td>${esc(i.marca)}</td>
        <td>${esc(i.regional)}</td>
        <td>${esc(i.setor)}</td>
        <td>${esc(i.loja)}</td>
        <td>${pillStatus(i.status, i.grupo)}</td>
        <td>${esc(i.fase || '—')}</td>
        <td class="mono">${dataCurta(i.abertura)}</td>
        <td class="mono${classeTempo(i.abertura)}">${tempoAberto(i.abertura) || '—'}</td>
        <td class="mono">${dataCurta(i.fechamento)}</td>
        <td>${esc(i.principal)}</td>
        <td>${esc(i.secundario)}</td>
        <td class="mono">${esc((i.tarefas || []).join(', ') || '—')}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

function render() {
  const D = DADOS;
  // concluidos ja saem no extrator; aqui e' so' uma rede de seguranca
  const abertos = D.itens.filter((i) => i.grupo === 'execucao');
  document.getElementById('conteudo').innerHTML = `
    ${cards(D.resumo)}
    <div class="aviso"><strong>Colunas ainda não mapeadas:</strong> Impacto, Abertura Impacto e Solicitação Token
    não existem na ordem de serviço do SOMA — precisam ser localizadas na origem da sua planilha de campo.
    O card “Chamados com Impacto” fica em “—” até lá, em vez de mostrar um número inventado.</div>
    ${Array.isArray(D.serie) && D.serie.length ? `
    <div class="sec-head"><h2>Abertos &times; Fechados &middot; últimos 14 dias</h2>
      <span class="sec-note">Chamados críticos &middot; Regional SUL &middot; fonte: ServiceNow SOMA</span></div>
    ${grafEvolucao(D.serie)}` : ''}
    <div class="sec-head"><h2>Chamados críticos em aberto · últimos ${D.janelaDias} dias</h2>
      <span class="sec-note">Prioridade 1 · Crítica · fonte: ServiceNow SOMA (wm_order · Regional SUL)</span></div>
    ${linhas(abertos)}
    <footer>
      <span>Fonte: ServiceNow · SOMA (wm_order, prioridade 1 - Crítica, work center CSUL)</span>
      <span class="mono">${abertos.length} chamados críticos em aberto</span>
    </footer>`;
}

async function iniciar() {
  try {
    const r = await fetch('data/campo.json?cb=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DADOS = await r.json();
    const dt = new Date(DADOS.atualizadoEm);
    document.getElementById('stamp').textContent = 'Atualizado ' + dt.toLocaleString('pt-BR');
    render();
  } catch (e) {
    document.getElementById('conteudo').innerHTML =
      `<div class="msg-erro">Não consegui carregar data/campo.json — ${esc(e.message)}</div>`;
    document.getElementById('stamp').textContent = 'erro';
  }
}
iniciar();


(function () {
  const shell = document.querySelector('.shell');
  const CHAVE = 'chamados_sidebar_collapsed';
  function aplicar(colapsado) {
    shell.classList.toggle('sb-collapsed', colapsado);
    shell.classList.toggle('sb-expanded', !colapsado);
  }
  let salvo = null;
  try { salvo = localStorage.getItem(CHAVE); } catch (e) {}
  const colapsado = salvo === null ? window.innerWidth <= 860 : salvo === '1';
  aplicar(colapsado);

  document.getElementById('sideToggle').addEventListener('click', () => {
    aplicar(true);
    try { localStorage.setItem(CHAVE, '1'); } catch (e) {}
  });
  document.getElementById('sideReopen').addEventListener('click', () => {
    aplicar(false);
    try { localStorage.setItem(CHAVE, '0'); } catch (e) {}
  });
})();
</script>
</body>
</html>
