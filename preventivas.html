<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<title>Preventivas — Sul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
--cobalto: #1e3bff;
--laranja: #ff6b00;
--laranja-bg: #fff4ee;
--rosa: #ff3366;
--verde: #00c853;
--verde-bg: #e8fdf0;
--amarelo: #ffcc00;
--amarelo-bg: #fffef0;
--cinza: #6b7280;
--cinza-bg: #f3f4f6;
--surface: #ffffff;
--bg: #f8f9fc;
--text: #111827;
--text-2: #374151;
--text-3: #9ca3af;
--border: #e5e7eb;
--shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
--r: 10px; --r-lg: 16px; --r-xl: 20px;
--sidebar-w: 220px;
/* aliases usados pelo JS existente */
--ink: var(--text);
--muted: var(--text-3);
--faint: var(--text-3);
--line: var(--border);
--ground: var(--bg);
--surface2: var(--cinza-bg);
--violet: var(--cobalto);
--violet-2: var(--cobalto);
--pink: var(--rosa);
--blue: var(--cobalto);
--sos: var(--rosa);
--sos-soft: rgba(255,51,102,0.10);
--alta: var(--laranja);
--alta-soft: rgba(255,107,0,0.12);
--ok: var(--verde);
--grid: rgba(0,0,0,0.06);
}
[data-theme="dark"] {
--surface: #1a1d2e; --bg: #0f1120; --text: #f1f5f9; --text-2: #94a3b8; --text-3: #475569;
--border: #2d3148; --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
--cinza-bg: #1f2235; --verde-bg: #0d2e1a; --laranja-bg: #2d1a0d;
--rosa-bg: #2d0d1a; --amarelo-bg: #2d2a0d;
--sos-soft: rgba(255,51,102,0.16); --alta-soft: rgba(255,107,0,0.16);
--grid: rgba(255,255,255,0.07);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: background .25s, color .25s; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: 'Inter', monospace; }
header { background: var(--surface); border-bottom: 2px solid var(--cobalto); padding: 12px 24px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.brand-mark { width: 38px; height: 38px; background: var(--cobalto); border-radius: 9px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: 900; flex-shrink: 0; }
.header-title { flex: 1; }
.header-title h1 { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.1; }
.header-title span { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
.carimbo { background: var(--cobalto); color: white; font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 20px; white-space: nowrap; }
.theme-btn { background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; transition: background .2s; }
.theme-btn:hover { background: var(--border); }
.layout { display: flex; flex: 1; }
aside { width: var(--sidebar-w); background: var(--surface); border-right: 1.5px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
aside .s-header { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-3); padding: 0 8px; margin-bottom: 4px; }
aside a, aside .navitem-static { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--r); color: var(--text-2); text-decoration: none; font-size: 13px; font-weight: 500; transition: background .15s, color .15s; cursor: pointer; }
aside a:hover, aside .navitem-static:hover { background: var(--bg); color: var(--text); }
aside a.active { background: var(--cobalto); color: white; }
aside .s-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; flex: none; }
aside a.active .s-dot { background: white; opacity: 1; }
.side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3); padding-left: 8px; }
main { flex: 1; padding: 22px 24px; overflow-y: auto; }
.kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 18px; }
@media (max-width: 1080px) { .kpis { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px) { .kpis { grid-template-columns: 1fr; } }
.kpi { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow); }
.kpi .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); display: block; margin-bottom: 7px; }
.kpi .val { font-size: clamp(22px,2.6vw,30px); font-weight: 900; letter-spacing: -1px; }
.kpi .hint { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.kpi.k-sos .val { color: var(--rosa); }
.kpi.k-alta .val { color: var(--laranja); }
.kpi.k-violet .val { color: var(--cobalto); }
.kpi.k-ok .val { color: var(--verde); }
section { margin-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
h2 { font-size: 15px; font-weight: 700; margin: 0; }
.sec-note { font-size: 11px; color: var(--text-3); }
.card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px 16px; box-shadow: var(--shadow); }
.card h3 { font-weight: 700; font-size: 13.5px; margin: 0 0 14px; }
.card-sub { font-size: 11px; color: var(--text-3); margin: -4px 0 12px; }
.abas { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.aba { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--cinza-bg); border: 1.5px solid var(--border); border-radius: 999px; padding: 7px 16px; cursor: pointer; }
.aba:hover { color: var(--text); }
.aba.on { background: var(--cobalto); border-color: var(--cobalto); color: #fff; }
/* grafico de barras */
.glegend { display: flex; gap: 14px; margin-bottom: 8px; font-size: 10.5px; color: var(--text-3); }
.glegend span { display: flex; align-items: center; gap: 5px; }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.sw-abre { background: var(--cobalto); }
.sw-fecha { background: var(--verde); }
.grafico { display: flex; gap: 3px; align-items: flex-end; height: 132px; overflow-x: auto; padding-bottom: 2px; }
.gcol { flex: 1 0 15px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.gpar { display: flex; gap: 2px; align-items: flex-end; height: 108px; width: 100%; justify-content: center; }
.gbar { width: 6px; border-radius: 3px 3px 0 0; min-height: 2px; }
.gb-abre { background: var(--cobalto); }
.gb-fecha { background: var(--verde); }
.glab { font-size: 9px; color: var(--text-3); }
/* percentual com semaforo */
.pct { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; }
.pct-ok { background: rgba(0,200,83,.13); color: var(--verde); }
.pct-alta { background: var(--alta-soft); color: var(--laranja); }
.pct-sos { background: var(--sos-soft); color: var(--rosa); }
.detail-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.detail-table th { text-align: left; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); padding: 8px 10px; position: sticky; top: 0; background: var(--surface); }
.detail-table td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; }
.detail-table tr:hover td { background: var(--cinza-bg); }
.detail-table td.forte { font-weight: 700; }
.detail-table td.ruim { color: var(--rosa); font-weight: 700; }
.tag { font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.tag.t-sos { background: var(--sos-soft); color: var(--rosa); }
.tag.t-ok { background: rgba(0,200,83,.13); color: var(--verde); }
.tag.t-violet { background: rgba(30,59,255,.13); color: var(--cobalto); }
.tag.t-faint { background: var(--cinza-bg); color: var(--text-3); }
.filter-table-wrap { max-height: 420px; overflow: auto; border-radius: 12px; }
.filter-table-wrap.alto { max-height: 620px; }
.filter-empty { padding: 24px 0; text-align: center; color: var(--text-3); font-size: 12.5px; }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.filter-field { display: flex; flex-direction: column; gap: 4px; min-width: 168px; }
.filter-field label { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.filter-field select { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); background: var(--cinza-bg); border: 1.5px solid var(--border); border-radius: var(--r); padding: 8px 10px; appearance: none; width: 100%; }
.filter-field.combo { position: relative; min-width: 268px; }
.combo-input { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); background: var(--cinza-bg); border: 1.5px solid var(--border); border-radius: var(--r); padding: 8px 30px 8px 10px; width: 100%; }
.combo-input::placeholder { color: var(--text-3); }
.combo-input:focus { outline: 2px solid var(--cobalto); outline-offset: -1px; }
.combo-x { position: absolute; right: 8px; bottom: 7px; width: 20px; height: 20px; line-height: 18px; text-align: center; border: 0; border-radius: 50%; background: var(--border); color: var(--text); font-size: 14px; cursor: pointer; padding: 0; }
.combo-x:hover { background: var(--sos-soft); color: var(--rosa); }
.combo-lista { position: absolute; top: 100%; left: 0; right: 0; z-index: 60; margin: 4px 0 0; padding: 4px; list-style: none; max-height: 262px; overflow-y: auto; background: var(--cinza-bg); border: 1.5px solid var(--border); border-radius: var(--r); box-shadow: 0 10px 26px rgba(0,0,0,.14); }
.combo-lista[hidden] { display: none; }
.combo-lista li { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); padding: 7px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.combo-lista li.ativo { background: var(--cobalto); color: #fff; }
.combo-lista li.todas { font-weight: 600; }
.combo-lista li.vazio { color: var(--text-3); cursor: default; }
.combo-lista li.vazio.ativo { background: none; color: var(--text-3); }
.filter-check { display: flex; align-items: center; gap: 7px; padding-bottom: 9px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-2); cursor: pointer; }
.filter-check input { accent-color: var(--cobalto); width: 15px; height: 15px; cursor: pointer; }
.filtro-limpar { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; color: var(--text-2); background: var(--cinza-bg); border: 1.5px solid var(--border); border-radius: var(--r); padding: 9px 14px; cursor: pointer; }
.filtro-limpar:hover { color: var(--text); }
.filtro-conta { font-size: 11.5px; color: var(--text-3); padding-bottom: 10px; }
/* mes a mes */
.mes-kpis { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; margin: 14px 0 4px; }
@media (max-width: 620px) { .mes-kpis { grid-template-columns: minmax(0,1fr); } }
.mes-kpi { background: var(--cinza-bg); border-radius: 14px; padding: 16px 18px; }
.mes-kpi .l { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.mes-kpi .n { font-weight: 800; font-size: 34px; line-height: 1.1; }
.mes-kpi .h { font-size: 10.5px; color: var(--text-2); margin-top: 2px; }
.mes-kpi.aberto .n { color: var(--cobalto); }
.mes-kpi.fechado .n { color: var(--verde); }
.mes-kpi.atrasado .n { color: var(--rosa); }
.mes-kpi.ok .n { color: var(--verde); }
.mes-kpi.alta .n { color: var(--laranja); }
.mes-kpi.ruim .n { color: var(--rosa); }
.mes-linha { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-size: 11.5px; color: var(--text-2); }
.mes-linha b { color: var(--text); font-weight: 600; }
/* farol aderencia */
.ader-wrap { display: grid; grid-template-columns: minmax(200px, 240px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .ader-wrap { grid-template-columns: minmax(0,1fr); } }
.ader-total { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 18px 16px 16px; box-shadow: var(--shadow); text-align: center; }
.ader-total h4 { font-weight: 700; font-size: 13.5px; margin: 0 0 10px; }
.ader-legenda { display: flex; gap: 14px; justify-content: center; margin-top: 10px; font-size: 10px; color: var(--text-3); }
.ader-legenda span { display: flex; align-items: center; gap: 5px; }
.ader-legenda i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.ader-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
.dcard { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 14px 12px 12px; box-shadow: var(--shadow); cursor: pointer; text-align: center; display: flex; flex-direction: column; gap: 6px; width: 100%; transition: transform .12s ease, box-shadow .12s ease; }
.dcard:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.08), 0 18px 34px rgba(0,0,0,.10); }
.dcard:focus-visible { outline: 2px solid var(--cobalto); outline-offset: 2px; }
.dcard.sel { border-color: var(--cobalto); box-shadow: 0 0 0 2px rgba(30,59,255,.22); }
.dnome { font-weight: 700; font-size: 12.5px; line-height: 1.25; min-height: 2.5em; display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere; hyphens: auto; text-align: center; }
.dsub { font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.dstats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 2px; }
.dstats .estat { padding: 5px 4px; text-align: center; background: var(--cinza-bg); border-radius: var(--r); }
.dstats .estat .n { font-weight: 700; font-size: 13px; }
.dstats .estat .l { font-size: 7.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.dstats .estat.crit .n { color: var(--rosa); }
.dstats .estat.ok .n { color: var(--verde); }
/* zap */
.zap-linha { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: -4px 0 12px; }
.btn-zap { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; color: #fff; background: #25D366; border: 0; border-radius: 10px; padding: 9px 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.btn-zap:hover { filter: brightness(.94); }
.btn-zap:disabled { opacity: .55; cursor: default; }
.btn-zap.ok { background: var(--verde); }
.zap-aviso { font-size: 11px; color: var(--text-3); }
.zap-aviso.alerta { color: var(--laranja); }
.farol-zerados { font-size: 10.5px; color: var(--text-3); margin: 14px 0 0; line-height: 1.5; }
footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.msg-carregando, .msg-erro { padding: 40px 0; text-align: center; color: var(--text-2); font-size: 13px; }
.msg-erro { color: var(--rosa); }
@media (max-width: 900px) { :root { --sidebar-w: 0px; } aside { display: none; } }
@media (max-width: 600px) { main { padding: 14px; } }
</style>
</head>
<body>
<header>
<div class="brand-mark">Z</div>
<div class="header-title"><h1>Preventivas</h1><span>Manutenção Sul · Regional Sul</span></div>
<div class="carimbo" id="stamp">carregando…</div>
<button class="theme-btn" onclick="toggleTheme()" title="Alternar tema">&#9788;</button>
</header>
<div class="layout">
<aside>
<div class="s-header">Navegação</div>
<a href="index.html"><span class="s-dot"></span> Backlog</a>
<a href="tecnicos.html"><span class="s-dot"></span> Técnicos</a>
<div class="s-header" style="margin-top:12px">Painéis</div>
<a href="perda.html"><span class="s-dot" style="color:var(--laranja)"></span> Perda de Receita</a>
<a href="risco.html"><span class="s-dot" style="color:var(--rosa)"></span> Gestão de Risco</a>
<a href="campo.html"><span class="s-dot" style="color:var(--cobalto)"></span> Acompanhamento Campo</a>
<a class="active" href="preventivas.html"><span class="s-dot" style="color:var(--verde)"></span> Preventivas</a>
<a href="sorvete.html"><span class="s-dot" style="color:var(--amarelo)"></span> Máquina de Sorvete</a>
<a href="pecas.html"><span class="s-dot" style="color:var(--cinza)"></span> Peças / Materiais</a>
<div class="s-header" style="margin-top:12px">Fonte</div>
<div class="navitem-static"><span class="s-dot"></span> ServiceNow · SOMA</div>
<div class="side-foot">Atualização diária · fonte SOMA (wm_task)</div>
</aside>
<main>
<div id="conteudo"><div class="msg-carregando">carregando data/preventivas.json…</div></div>
</main>
</div>
<script>
function toggleTheme() {
var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
document.documentElement.setAttribute('data-theme', next);
localStorage.setItem('preventivas-theme', next);
}
(function() {
var saved = localStorage.getItem('preventivas-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);
})();
let DADOS = null;
const VISTA = { aba: 'tecnico', farol: 'tecnico', mes: null };
const FILTROS = { loja: '', tecnico: '', setor: '', estado: '', equipamento: '', soAtrasadas: false };
let LOJAS_LISTA = [];
function escapeHtml(s) {
return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
const chaveBusca = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const n = (v) => (v == null ? '—' : String(v));
function kpis(t) {
const c = (rotulo, valor, cls, nota) => `<div class="kpi ${cls || ''}">
<div class="label">${escapeHtml(rotulo)}</div>
<div class="val num">${escapeHtml(String(valor))}</div>
${nota ? `<div class="hint">${escapeHtml(nota)}</div>` : ''}
</div>`;
return `<div class="kpis">
${c('Preventivas em aberto', t.abertas, 'k-violet', t.total + ' na janela de ' + DADOS.janelaDias + ' dias')}
${c('Atrasadas', t.atrasadas, 'k-sos', t.pctAtraso + '% das abertas')}
${c('Concluídas', t.concluidas, 'k-ok', t.pctConclusao + '% de conclusão')}
${c('Mais antiga em aberto', t.maisAntigaDias + 'd', 'k-alta', 'média ' + t.mediaDiasAberta + 'd')}
</div>
<div class="kpis">
${c('Lojas com preventiva', t.lojas, '', 'na regional Sul')}
${c('Equipamentos', t.equipamentos ?? '—', '', 'tipos distintos em preventiva')}
${c('Canceladas', t.canceladas, '', 'fora do cálculo de conclusão')}
${c('Total no período', t.total, '', 'abertas + concluídas + canceladas')}
</div>`;
}
function grafico(serie) {
if (!serie || !serie.length) return '';
const max = Math.max(1, ...serie.map(d => Math.max(d.abertas, d.concluidas)));
const barras = serie.map(d => {
const [ano, mes, dia] = d.dia.split('-');
return `<div class="gcol" title="${escapeHtml(dia + '/' + mes)} · ${d.abertas} abertas · ${d.concluidas} concluídas">
<div class="gpar">
<div class="gbar gb-abre" style="height:${Math.round(d.abertas / max * 100)}%"></div>
<div class="gbar gb-fecha" style="height:${Math.round(d.concluidas / max * 100)}%"></div>
</div>
<div class="glab">${escapeHtml(dia)}</div>
</div>`;
}).join('');
return `<div class="card">
<h3>Abertura × conclusão por dia</h3>
<p class="card-sub">últimos ${serie.length} dias com movimento · pico de ${max} no dia</p>
<div class="glegend">
<span><i class="sw sw-abre"></i>abertas</span><span><i class="sw sw-fecha"></i>concluídas</span>
</div>
<div class="grafico">${barras}</div>
</div>`;
}
const MES_NOME = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function rotuloMes(iso) {
const m = String(iso || '').match(/^(\d{4})-(\d{2})$/);
if (!m) return iso || '—';
const nome = MES_NOME[+m[2] - 1] || '?';

if (li) { ev.preventDefault(); escolherLoja(li.dataset.valor); return; }
if (ev.target.closest('#fLojaX')) { ev.preventDefault(); escolherLoja(''); return; }
if (!ev.target.closest('[data-combo="loja"]')) fecharLista();
});
document.addEventListener('keydown', (ev) => {
if (ev.target.id !== 'fLoja') return;
const ul = document.getElementById('fLojaLista');
if (!ul) return;
if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
ev.preventDefault();
if (ul.hidden) { abrirLista(ev.target.value); return; }
const itens = [...ul.querySelectorAll('li[data-valor]')];
const at = itens.findIndex(li => li.classList.contains('ativo'));
marcarAtivo(ev.key === 'ArrowDown' ? at + 1 : at - 1);
} else if (ev.key === 'Enter') {
ev.preventDefault();
const at = ul.querySelector('li.ativo[data-valor]');
if (at) escolherLoja(at.dataset.valor);
} else if (ev.key === 'Escape') {
ev.stopPropagation();
fecharLista();
ev.target.value = ev.target.dataset.sel || '';
ev.target.blur();
}
});
(async function iniciar() {
try {
const r = await fetch('data/preventivas.json', { cache: 'no-store' });
if (!r.ok) throw new Error('HTTP ' + r.status);
DADOS = await r.json();
} catch (e) {
document.getElementById('conteudo').innerHTML =
`<div class="msg-erro">Não consegui carregar os dados (${escapeHtml(e.message)}).</div>`;
return;
}
document.getElementById('stamp').textContent = 'Atualizado ' + (DADOS.atualizadoEm || '—');
render();
})();
</script>
