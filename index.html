<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Backlog — Sul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --sidebar:   #1E1B3A;
    --sidebar-2: #2A2555;
    --ground:    #F3F1FB;
    --surface:   #FFFFFF;
    --surface2:  #F6F4FC;
    --ink:       #211D3D;
    --muted:     #726E93;
    --faint:     #A9A5C6;
    --line:      #ECEAF6;
    --violet:    #7C5CFC;
    --violet-2:  #A78BFA;
    --pink:      #F472B6;
    --blue:      #38BDF8;
    --sos:       #E43F5A;
    --sos-soft:  rgba(228,63,90,0.10);
    --alta:      #F5A623;
    --alta-soft: rgba(245,166,35,0.12);
    --ok:        #22C08D;
    --grid:      rgba(33,29,61,0.06);
    --shadow:    0 1px 2px rgba(33,29,61,.04), 0 12px 28px rgba(33,29,61,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #100E22; --surface: #1A1733; --surface2: #211D42;
      --ink: #ECEAFB; --muted: #A29DC7; --faint: #6C6791; --line: #2C2854;
      --violet: #9A82FF; --violet-2: #C4B5FD; --pink: #F9A8D4; --blue: #7DD3FC;
      --sos: #F3697F; --sos-soft: rgba(243,105,127,0.16);
      --alta: #FBBF56; --alta-soft: rgba(251,191,86,0.16); --ok: #4ADE9E;
      --grid: rgba(236,234,251,0.07); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 32px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"] {
    --ground:   #100E22; --surface: #1A1733; --surface2: #211D42;
    --ink: #ECEAFB; --muted: #A29DC7; --faint: #6C6791; --line: #2C2854;
    --violet: #9A82FF; --violet-2: #C4B5FD; --pink: #F9A8D4; --blue: #7DD3FC;
    --sos: #F3697F; --sos-soft: rgba(243,105,127,0.16);
    --alta: #FBBF56; --alta-soft: rgba(251,191,86,0.16); --ok: #4ADE9E;
    --grid: rgba(236,234,251,0.07); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 32px rgba(0,0,0,.32);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .shell { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: 100vh; transition: grid-template-columns .22s ease; }
  .shell.sb-collapsed { grid-template-columns: 0 minmax(0,1fr); }
  @media (max-width: 860px) { .shell:not(.sb-expanded) { grid-template-columns: 0 minmax(0,1fr); } }

  /* ---------- sidebar ---------- */
  .side {
    background: linear-gradient(180deg, var(--sidebar), var(--sidebar-2));
    padding: 26px 20px; display: flex; flex-direction: column; gap: 30px; color: #EDEAFF;
    position: relative; overflow: hidden; white-space: nowrap; min-width: 0;
    transition: opacity .18s ease;
  }
  .shell.sb-collapsed .side { opacity: 0; padding-left: 0; padding-right: 0; }

  .side-toggle {
    position: absolute; top: 22px; right: 14px; width: 26px; height: 26px; border-radius: 999px;
    background: rgba(255,255,255,0.08); border: none; color: #C6C0EE; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; flex: none;
  }
  .side-toggle:hover { background: rgba(255,255,255,0.16); color: #FFFFFF; }

  .side-reopen {
    display: none; position: fixed; top: 22px; left: 18px; z-index: 40;
    width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); box-shadow: var(--shadow); cursor: pointer;
    align-items: center; justify-content: center; font-size: 15px; line-height: 1;
  }
  .side-reopen:hover { color: var(--violet); }
  .shell.sb-collapsed .side-reopen { display: flex; }

  .brand { display: flex; align-items: center; gap: 11px; padding-right: 24px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-family: "Archivo", sans-serif; font-weight: 800; font-size: 15px; color: white; flex: none;
  }
  .brand .name { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .brand .sub { font-size: 11px; color: #A79FE0; }

  .navgroup { display: flex; flex-direction: column; gap: 3px; }
  .navlabel { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #7A72B8; padding: 0 12px; margin: 14px 0 6px; }
  .navitem {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px;
    color: #C6C0EE; font-size: 13.5px; font-weight: 500; text-decoration: none;
  }
  a.navitem:hover { background: rgba(255,255,255,0.06); color: #FFFFFF; }
  .navitem .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; opacity: .55; flex: none; }
  .navitem.active { background: rgba(255,255,255,0.08); color: #FFFFFF; }
  .navitem.active .dot { background: var(--pink); opacity: 1; }

  .side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11.5px; color: #8B84C4; }

  /* ---------- main ---------- */
  .main { padding: clamp(18px,3vw,34px) clamp(16px,3.5vw,40px) 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); margin: 0 0 6px; }
  h1 { font-family: "Archivo", sans-serif; font-weight: 800; font-size: clamp(24px,3.4vw,32px); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .stamp-pill {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; box-shadow: var(--shadow);
  }

  .kpis { display: grid; grid-template-columns: repeat(5,1fr); gap: 13px; margin: 22px 0 30px; }
  @media (max-width: 1080px) { .kpis { grid-template-columns: repeat(3,1fr); } }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2,1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 17px 14px; box-shadow: var(--shadow); }
  .kpi .label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display:block; margin-bottom: 7px; }
  .kpi .val { font-family: "Archivo", sans-serif; font-weight: 800; font-size: clamp(20px,2.6vw,25px); letter-spacing: -0.01em; }
  .kpi.k-sos .val { color: var(--sos); }
  .kpi.k-alta .val { color: var(--alta); }
  .kpi.k-violet .val { color: var(--violet); }

  section { margin-top: 34px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 15px; flex-wrap: wrap; }
  h2 { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin: 0; }
  .sec-note { font-size: 12px; color: var(--faint); font-family: "IBM Plex Mono", monospace; }

  .equip-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; align-items: start; }
  @media (max-width: 980px) { .equip-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
  @media (max-width: 640px) { .equip-grid { grid-template-columns: minmax(0,1fr); } }

  .ecard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; text-align: left; }
  .ecard:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(33,29,61,.08), 0 18px 34px rgba(33,29,61,.10); }
  .ecard:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .ecard .ehead { display: flex; align-items: center; justify-content: space-between; }
  .ecard .etitle { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 14.5px; }
  .ecard .eopen { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); }

  .donut-row { display: flex; align-items: center; gap: 16px; }
  .donut-wrap { position: relative; width: 92px; height: 92px; flex: none; }
  .donut-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut-wrap .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-wrap .pctv { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 17px; }
  .donut-wrap .pctl { font-family: "IBM Plex Mono", monospace; font-size: 8.5px; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }

  .estats { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .estat { background: var(--surface2); border-radius: 10px; padding: 8px 10px; }
  .estat .n { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 16px; }
  .estat .l { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .estat.crit .n { color: var(--sos); }
  .estat.alta .n { color: var(--alta); }

  .etime { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .etime b { color: var(--ink); font-family: "IBM Plex Mono", monospace; }

  .esos-label { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .esos-label::before { content: "●"; font-size: 8px; }
  .esos-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .esos-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; }
  .esos-item .loja { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .esos-empty { font-size: 11.5px; color: var(--faint); }

  /* ---------- farol por supervisor (velocimetro) ---------- */
  .gauge-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .gauge-grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
  @media (max-width: 860px) { .gauge-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
  @media (max-width: 520px) { .gauge-grid { grid-template-columns: minmax(0,1fr); } }
  .gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; text-align: left; }
  .gcard:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(33,29,61,.08), 0 18px 34px rgba(33,29,61,.10); }
  .gcard:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .ghead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .ghead > div { min-width: 0; }
  .gname { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 13.5px; display: block; }
  .gsetor { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; display: block; margin-top: 1px; }
  .gdetalhe { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); white-space: nowrap; flex: none; }
  .ggauge { margin: 0 -4px; }
  .gval { display: flex; flex-direction: column; align-items: center; margin-top: -34px; }
  .gnum { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 26px; }
  .glabel { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .gstats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
  .gstats .estat { padding: 6px 6px; text-align: center; }
  .gstats .estat .n { font-size: 14px; }
  .gstats .estat .l { font-size: 8px; }

  /* consolidado: barras horizontais */
  .cons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 780px) { .cons-grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 16px; box-shadow: var(--shadow); }
  .card h3 { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 13.5px; margin: 0 0 14px; }
  .hbar-row { display: grid; grid-template-columns: 108px 1fr 40px; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 12px; }
  .hbar-row .lbl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-track { background: var(--surface2); border-radius: 999px; height: 9px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 999px; }
  .hbar-row .v { text-align: right; font-family: "IBM Plex Mono", monospace; font-weight: 600; }

  footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .msg-carregando, .msg-erro { padding: 40px 0; text-align: center; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .msg-erro { color: var(--sos); }

  /* ---------- grafico de evolucao ---------- */
  .chart-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
  .chart-legend .li { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chart-note { font-size: 12px; color: var(--faint); font-family: "IBM Plex Mono", monospace; margin-top: 10px; }

  .hist-stamp { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); margin-bottom: 12px; }
  .chart-svg-wrap { position: relative; }
  .chart-dot { cursor: pointer; }
  .chart-tooltip {
    position: absolute; z-index: 20; pointer-events: none; transform: translate(-50%, -100%);
    background: var(--ink); color: var(--surface); border-radius: 10px; padding: 7px 10px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; white-space: nowrap; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
  }
  .chart-tooltip .ctt-quando { font-size: 9.5px; opacity: .75; }
  .chart-tooltip .ctt-valor { font-weight: 700; font-size: 13px; }
  .hist-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 780px) { .hist-stats { grid-template-columns: repeat(2,1fr); } }
  .hstat { background: var(--surface2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .hstat-lbl { display: flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .hstat-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .hstat-val { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.01em; }
  .hstat-delta { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); }

  /* ---------- modal de detalhe ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(16,14,34,0.55); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-panel {
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
    width: min(760px, 100%); max-height: min(640px, 88vh); display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); flex: none; }
  .modal-head h3 { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 16.5px; margin: 0; }
  .modal-close {
    appearance: none; border: none; background: var(--surface2); color: var(--muted); width: 30px; height: 30px;
    border-radius: 999px; font-size: 17px; line-height: 1; cursor: pointer;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-sub { padding: 12px 22px 0; font-size: 12px; color: var(--faint); font-family: "IBM Plex Mono", monospace; flex: none; }
  .modal-filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; padding: 12px 22px 0; flex: none; }
  .modal-filtros .filter-field { min-width: 130px; }
  .modal-filtro-contagem { padding: 8px 22px 0; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--faint); flex: none; }
  .modal-body { overflow: auto; padding: 14px 22px 20px; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .detail-table th {
    text-align: left; font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--faint); padding: 8px 10px; position: sticky; top: 0; background: var(--surface);
  }
  .detail-table td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  .detail-table tr:hover td { background: var(--surface2); }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .tag-sos { background: var(--sos-soft); color: var(--sos); }
  .tag-alta { background: var(--alta-soft); color: var(--alta); }
  .tag-normal { background: var(--surface2); color: var(--muted); }

  /* ---------- busca de chamados (filtro setor/loja/responsavel) ---------- */
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filter-field { display: flex; flex-direction: column; gap: 4px; min-width: 168px; flex: 1; }
  .filter-field label {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
  }
  .filter-field select, .filter-field input[type="text"] {
    font-family: "IBM Plex Sans", sans-serif; font-size: 13px; color: var(--ink); background: var(--surface2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; appearance: none; width: 100%;
  }
  .filter-field input[type="text"]:focus { outline: 2px solid var(--violet); outline-offset: -1px; }
  .filter-combo { position: relative; }
  .filter-combo-lista {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; max-height: 240px; overflow: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px;
  }
  .filter-combo-item { padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .filter-combo-item:hover, .filter-combo-item.ativo { background: var(--surface2); }
  .filter-combo-vazio { padding: 7px 10px; font-size: 12.5px; color: var(--faint); }
  .filter-field-datas { min-width: 240px; }
  .filter-datas { display: flex; align-items: center; gap: 6px; }
  .filter-datas input[type="date"] {
    font-family: "IBM Plex Sans", sans-serif; font-size: 12.5px; color: var(--ink); background: var(--surface2);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; flex: 1; min-width: 0;
  }
  .filter-datas span { font-size: 11.5px; color: var(--faint); flex: none; }
  .filter-clear {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--violet); background: none; border: none;
    cursor: pointer; padding: 8px 4px; white-space: nowrap; align-self: flex-end;
  }
  .filter-clear:hover { text-decoration: underline; }
  .filter-count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .filter-table-wrap { max-height: 520px; overflow: auto; border-radius: 12px; }
  .filter-empty { padding: 30px 0; text-align: center; color: var(--faint); font-size: 12.5px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <button class="side-toggle" id="sideToggle" type="button" aria-label="Recolher menu">‹</button>
    <div class="brand">
      <div class="mark">Z</div>
      <div><div class="name">Manutenção Sul</div><div class="sub">Zamp · BK Brasil</div></div>
    </div>
    <div class="navgroup">
      <div class="navitem active"><span class="dot"></span>Backlog</div>

<script>
const brl0 = n => n.toLocaleString('pt-BR');
let DADOS_ATUAIS = null;

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// semaforo por severidade do % de indisponibilidade: vermelho = pior,
// laranja = medio, verde = bom (pedido do Christian, 09/09/2026)
function corPorIndisponibilidade(pct) {
  if (pct >= 50) return 'var(--sos)';
  if (pct >= 25) return 'var(--alta)';
  return 'var(--ok)';
}

function donutSVG(pct, cor) {
  const r = 38, c = 2 * Math.PI * r;
  const dash = (Math.min(pct, 100) / 100) * c;
  return `<svg viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${cor}" stroke-width="9"
      stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"/>
  </svg>`;
}

// faixas do farol por supervisor: vermelho = mais chamados, verde = menos
// (pedido do Christian, 09/09/2026) -- corrigido em 09/09/2026 p/ os 4
// supervisores reais (Marcel/Rafael/Gustavo/Carlos Magno, cada um cobrindo
// varios setores/lojas). Escala fixa 0-120 (o maior valor observado foi
// 108), faixas em 60 e 90.
const FAROL_MAX = 120;
const FAROL_ZONAS = [
  { de: 0, ate: 60, cor: 'var(--ok)' },
  { de: 60, ate: 90, cor: 'var(--alta)' },
  { de: 90, ate: FAROL_MAX, cor: 'var(--sos)' },
];
function corDoFarol(valor) {
  const z = FAROL_ZONAS.find(z => valor < z.ate) || FAROL_ZONAS[FAROL_ZONAS.length - 1];
  return z.cor;
}

function gaugeSVG(valor, max, zonas) {
  const cx = 100, cy = 100, r = 80, sw = 16;
  const toRad = deg => deg * Math.PI / 180;
  const angulo = v => 180 - (Math.min(v, max) / max) * 180;
  const ponto = (deg, raio) => {
    const rad = toRad(deg);
    return { x: cx + raio * Math.cos(rad), y: cy - raio * Math.sin(rad) };
  };
  const arco = (v0, v1, cor) => {
    const p0 = ponto(angulo(v0), r), p1 = ponto(angulo(v1), r);
    return `<path d="M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)} A ${r} ${r} 0 0 1 ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}" fill="none" stroke="${cor}" stroke-width="${sw}"/>`;
  };
  const zonasSvg = zonas.map(z => arco(z.de, z.ate, z.cor)).join('');
  const pontaAgulha = ponto(angulo(valor), r - sw / 2 - 8);
  const agulha = `<line x1="${cx}" y1="${cy}" x2="${pontaAgulha.x.toFixed(1)}" y2="${pontaAgulha.y.toFixed(1)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)"/>`;
  return `<svg viewBox="0 0 200 112" style="width:100%;height:auto;display:block;">${zonasSvg}${agulha}</svg>`;
}

// ordem de exibicao nos modais: SOS primeiro, depois Alta, depois Normal;
// dentro de cada prioridade, mais dias em aberto primeiro (os itens ja vem
// assim do backend, isso aqui e' so garantia caso a origem mude)
const RANK_PRIORIDADE = { SOS: 0, Alta: 1, Normal: 2 };
function ordenaChamados(itens) {
  return [...itens].sort((a, b) => {
    const r = (RANK_PRIORIDADE[a.prioridade] ?? 9) - (RANK_PRIORIDADE[b.prioridade] ?? 9);
    return r !== 0 ? r : b.dias - a.dias;
  });
}
const tagClsPrioridade = p => p === 'SOS' ? 'tag-sos' : (p === 'Alta' ? 'tag-alta' : 'tag-normal');

// bloco "Mais urgentes" reaproveitado nos cards de equipamento, supervisor e
// tecnico -- pedido do Christian, 12/09/2026: mostrar os 5 chamados mais
// urgentes (ja vem ordenado por prioridade+dias do backend) tambem nos
// faroles de supervisor/tecnico, do mesmo jeito que ja existia no card de
// equipamento.
function blocoMaisUrgentes(itens) {
  const top5 = (itens || []).slice(0, 5);
  const html = top5.length
    ? top5.map(c => `<div class="esos-item"><span class="loja">${escapeHtml(c.loja)}</span><span class="tag ${tagClsPrioridade(c.prioridade)}">${c.dias}d</span></div>`).join('')
    : '<div class="esos-empty">Nenhum chamado em aberto.</div>';
  return `<div>
      <div class="esos-label">Mais urgentes (${top5.length})</div>
      <div class="esos-list">${html}</div>
    </div>`;
}

let MODAL_ITENS = [];
let MODAL_MOSTRA_EQUIP = false;

function semAcentoModal(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function renderizarModalTabela() {
  const flBusca = semAcentoModal(document.getElementById('modalFiltroLoja').value.trim());
  const fpBusca = semAcentoModal(document.getElementById('modalFiltroProblema').value.trim());
  const fr = document.getElementById('modalFiltroResp').value;
  const dataDe = document.getElementById('modalFiltroDataDe').value;
  const dataAte = document.getElementById('modalFiltroDataAte').value;

  const filtrados = ordenaChamados(MODAL_ITENS.filter(c =>
    (!flBusca || semAcentoModal(c.loja).includes(flBusca))
    && (!fpBusca || semAcentoModal(c.problema).includes(fpBusca))
    && (!fr || c.tecnico === fr)
    && (!dataDe || (c.abertura && c.abertura >= dataDe))
    && (!dataAte || (c.abertura && c.abertura <= dataAte))
  ));

  document.getElementById('modalFiltroContagem').textContent = `${filtrados.length} de ${MODAL_ITENS.length} chamados`;
  const colspan = MODAL_MOSTRA_EQUIP ? 8 : 7;
  document.getElementById('modalTbody').innerHTML = filtrados.length
    ? filtrados.map(c => `<tr>
        <td class="mono">${escapeHtml(c.numero)}</td>
        ${MODAL_MOSTRA_EQUIP ? `<td>${escapeHtml(c.equipamento)}</td>` : ''}
        <td>${escapeHtml(c.loja)}</td>
        <td>${escapeHtml(c.problema) || '—'}</td>
        <td>${escapeHtml(c.estado)}</td>
        <td><span class="tag ${tagClsPrioridade(c.prioridade)}">${escapeHtml(c.prioridade)}</span></td>
        <td class="num">${c.dias}d</td>
        <td>${escapeHtml(c.tecnico) || '—'}</td>
      </tr>`).join('')
    : `<tr><td colspan="${colspan}" class="esos-empty">Nenhum chamado com esses filtros.</td></tr>`;
}

function abrirModalGenerico(titulo, subtitulo, itens, { mostrarEquipamento } = {}) {
  document.getElementById('modalTitle').textContent = titulo;
  document.getElementById('modalSub').textContent = subtitulo;
  const colEquip = mostrarEquipamento ? '<th>Equipamento</th>' : '';
  document.getElementById('modalThead').innerHTML =
    `<tr><th>Número</th>${colEquip}<th>Loja</th><th>Problema</th><th>Estado</th><th>Prioridade</th><th>Dias</th><th>Técnico</th></tr>`;

  MODAL_ITENS = itens;
  MODAL_MOSTRA_EQUIP = !!mostrarEquipamento;

  // reseta os filtros e repopula as opcoes com base nos itens deste modal
  const inLoja = document.getElementById('modalFiltroLoja');
  const inProblema = document.getElementById('modalFiltroProblema');
  const selResp = document.getElementById('modalFiltroResp');
  inLoja.value = ''; inProblema.value = '';
  document.getElementById('modalFiltroDataDe').value = '';
  document.getElementById('modalFiltroDataAte').value = '';
  document.getElementById('modalFiltroLojaLista').hidden = true;
  const responsaveis = [...new Set(itens.map(c => c.tecnico).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  selResp.innerHTML = '<option value="">Todos</option>' + responsaveis.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');

  renderizarModalTabela();
  document.getElementById('modalOverlay').hidden = false;
  document.body.style.overflow = 'hidden';
}

// filtros do modal -- os elementos sao fixos no HTML (o modal e' reaproveitado
// a cada abertura), entao os listeners so' precisam ser ligados uma vez
(function () {
  const inLoja = document.getElementById('modalFiltroLoja');
  const listaLoja = document.getElementById('modalFiltroLojaLista');
  const inProblema = document.getElementById('modalFiltroProblema');
  const selResp = document.getElementById('modalFiltroResp');
  const inDataDe = document.getElementById('modalFiltroDataDe');
  const inDataAte = document.getElementById('modalFiltroDataAte');

  function mostrarListaLojaModal() {
    const busca = semAcentoModal(inLoja.value.trim());
    const lojas = [...new Set(MODAL_ITENS.map(c => c.loja).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const opcoes = (busca ? lojas.filter(l => semAcentoModal(l).includes(busca)) : lojas).slice(0, 40);
    listaLoja.innerHTML = opcoes.length
      ? opcoes.map(l => `<div class="filter-combo-item">${escapeHtml(l)}</div>`).join('')
      : `<div class="filter-combo-vazio">Nenhuma loja encontrada</div>`;
    listaLoja.hidden = false;
  }
  inLoja.addEventListener('input', () => { mostrarListaLojaModal(); renderizarModalTabela(); });
  inLoja.addEventListener('focus', mostrarListaLojaModal);
  listaLoja.addEventListener('mousedown', (ev) => {
    const item = ev.target.closest('.filter-combo-item');
    if (!item) return;
    ev.preventDefault();
    inLoja.value = item.textContent;
    listaLoja.hidden = true;
    renderizarModalTabela();
  });
  document.addEventListener('click', (ev) => {
    if (ev.target !== inLoja && !listaLoja.contains(ev.target)) listaLoja.hidden = true;
  });

  inProblema.addEventListener('input', renderizarModalTabela);
  selResp.addEventListener('change', renderizarModalTabela);
  [inDataDe, inDataAte].forEach(el => el.addEventListener('change', renderizarModalTabela));
  document.getElementById('modalFiltroLimpar').addEventListener('click', () => {
    inLoja.value = ''; inProblema.value = ''; selResp.value = '';
    inDataDe.value = ''; inDataAte.value = '';
    listaLoja.hidden = true;
    renderizarModalTabela();
  });
})();

function abrirModal(chave) {
  const e = DADOS_ATUAIS?.equipamentos.find(x => x.chave === chave);
  if (!e) return;
  const itens = e.chamadosDetalhe || [];
  abrirModalGenerico(
    e.nome,
    `${itens.length} chamado(s) em aberto · ${e.pdvsEmFalha} lojas afetadas · ${e.alta} Alta · ${e.sos} SOS`,
    itens,
    { mostrarEquipamento: false }
  );
}

function abrirModalSupervisor(nome) {
  const s = DADOS_ATUAIS?.supervisores?.find(x => x.nome === nome);
  if (!s) return;
  const itens = s.chamadosDetalhe || [];
  abrirModalGenerico(
    s.nome,
    `${itens.length} chamado(s) em aberto · ${s.lojasComChamado}/${s.totalLojas} lojas afetadas · ${s.alta} Alta · ${s.sos} SOS`,
    itens,
    { mostrarEquipamento: true }
  );
}

function fecharModal() {
  document.getElementById('modalOverlay').hidden = true;
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', fecharModal);
document.getElementById('modalOverlay').addEventListener('click', (ev) => {
  if (ev.target.id === 'modalOverlay') fecharModal();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !document.getElementById('modalOverlay').hidden) fecharModal();
});

function lineChartSVG(pontos, series) {
  const W = 800, H = 220, padL = 34, padR = 34, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = pontos.length;
  const maxV = Math.max(...series.flatMap(s => pontos.map(p => p[s.key])), 1);
  const x = i => n <= 1 ? padL + innerW / 2 : padL + (i / (n - 1)) * innerW;
  const y = v => padT + innerH - (v / maxV) * innerH;

  const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const yy = padT + innerH * (1 - f);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${padL - 6}" y="${(yy + 3).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--faint)" font-family="IBM Plex Mono, monospace">${Math.round(maxV * f)}</text>`;
  }).join('');

  // rotulo do valor atual (ponta da linha) -- espalha verticalmente quando
  // duas series terminam perto uma da outra, pra nao sobrepor o numero
  const finais = series.map(s => ({ s, v: pontos[n - 1][s.key] })).sort((a, b) => b.v - a.v);
  const minGap = 11;
  finais.forEach((f, i) => { f.yLabel = i === 0 ? y(f.v) : Math.max(y(f.v), finais[i - 1].yLabel + minGap); });
  const yLabelPorChave = Object.fromEntries(finais.map(f => [f.s.key, f.yLabel]));

  // dado de cada bolinha guardado em atributos data-* pra o tooltip (caixa
  // com o valor exato) ler no hover, sem precisar recalcular nada -- pedido
  // do Christian, 12/09/2026.
  const dotAttrs = (p, i, s) => {
    const d = new Date(p.quando || (p.data + 'T00:00:00'));
    const quandoFmt = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    return `class="chart-dot" data-valor="${p[s.key]}" data-label="${escapeHtml(s.label)}" data-cor="${s.color}" data-quando="${quandoFmt}"`;
  };

  const seriesSvg = series.map(s => {
    const valorFinal = pontos[n - 1][s.key];
    const rotuloFinal = `<text x="${(x(n - 1) + 8).toFixed(1)}" y="${(yLabelPorChave[s.key] + 3).toFixed(1)}" font-size="11" font-weight="700" fill="${s.color}" font-family="IBM Plex Mono, monospace">${valorFinal}</text>`;
    if (n === 1) {
      return `<circle cx="${x(0).toFixed(1)}" cy="${y(pontos[0][s.key]).toFixed(1)}" r="5" fill="${s.color}" ${dotAttrs(pontos[0], 0, s)}/>${rotuloFinal}`;
    }
    const pts = pontos.map((p, i) => `${x(i).toFixed(1)},${y(p[s.key]).toFixed(1)}`).join(' ');
    const dots = pontos.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p[s.key]).toFixed(1)}" r="5" fill="${s.color}" fill-opacity="0" stroke="${s.color}" stroke-width="0" ${dotAttrs(p, i, s)}/>`).join('');
    const dotsVisiveis = pontos.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p[s.key]).toFixed(1)}" r="3" fill="${s.color}" style="pointer-events:none"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="pointer-events:none"/>${dotsVisiveis}${dots}${rotuloFinal}`;
  }).join('');

  // rotulo com dia + hora (ex.: "09/09 22h") pra dar pra comparar o mesmo
  // horario entre dias, agora que cada execucao (a cada 2h) vira um ponto
  const passo = Math.max(1, Math.ceil(n / 7));
  const labels = pontos.map((p, i) => {
    if (i % passo !== 0 && i !== n - 1) return '';
    const d = new Date(p.quando || (p.data + 'T00:00:00'));
    const dataLbl = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    const horaLbl = d.toLocaleTimeString('pt-BR', { hour: '2-digit' });
    return `<text x="${x(i).toFixed(1)}" y="${H - 8}" font-size="9" text-anchor="middle" fill="var(--faint)" font-family="IBM Plex Mono, monospace">${dataLbl} ${horaLbl}</text>`;
  }).join('');

  return `<div class="chart-svg-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${grid}${seriesSvg}${labels}</svg><div class="chart-tooltip" id="chartTooltip" hidden></div></div>`;
}

async function carregarHistorico() {
  const alvo = document.getElementById('chartCard');
  if (!alvo) return;
  let H;
  try {
    const r = await fetch('data/historico.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    H = await r.json();
  } catch (e) {
    alvo.innerHTML = `<div class="chart-note">Histórico ainda não disponível.</div>`;
    return;
  }
  if (!Array.isArray(H) || !H.length) {
    alvo.innerHTML = `<div class="chart-note">Histórico vazio.</div>`;
    return;
  }
  // pontos gravados antes de 10/09/2026 nao tem esses campos -- sem isso o
  // Math.max(...) do grafico vira NaN e quebra as 4 linhas inteiras.
  H.forEach(p => {
    p.totalAlta ??= 0;
    p.totalSOS ??= 0;
    p.totalAbertosHoje ??= 0;
    p.totalFechadosHoje ??= 0;
  });

  // acompanhamento e' SOS, Alta (estoque atual) e Abertos/Fechados DO DIA
  // (pedido do Christian, 10/09/2026 -- "a quantidade aberta e fechada deve
  // ser do dia e nao total"). Abertos hoje = contagem exata pela data de
  // abertura do chamado; Fechados hoje = estimativa pela diferenca do
  // estoque de fechados desde a 1a execucao do dia (o SOMA nao tem data de
  // fechamento no CSV). Os dois reiniciam perto de 0 a cada novo dia.
  const series = [
    { key: 'totalSOS', label: 'SOS', color: 'var(--sos)' },
    { key: 'totalAlta', label: 'Alta', color: 'var(--alta)' },
    { key: 'totalAbertosHoje', label: 'Abertos hoje', color: 'var(--violet)' },
    { key: 'totalFechadosHoje', label: 'Fechados hoje', color: 'var(--blue)' },
  ];

  const ultimo = H[H.length - 1];
  const anterior = H.length > 1 ? H[H.length - 2] : null;
  const horaUltimo = new Date(ultimo.quando || ultimo.data).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const horaAnterior = anterior ? new Date(anterior.quando || anterior.data).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : null;

  const statsHtml = series.map(s => {
    const valor = ultimo[s.key];
    let deltaHtml;
    if (!anterior) {
      deltaHtml = `<span class="hstat-delta">primeira execução registrada</span>`;
    } else {
      const delta = valor - anterior[s.key];
      const sinal = delta > 0 ? '+' + delta : delta < 0 ? String(delta) : '=';
      const seta = delta > 0 ? '▲' : delta < 0 ? '▼' : '';
      deltaHtml = `<span class="hstat-delta">${seta} ${sinal} desde ${horaAnterior}</span>`;
    }
    return `<div class="hstat">
      <span class="hstat-lbl"><span class="hstat-dot" style="background:${s.color}"></span>${s.label}</span>
      <span class="hstat-val" style="color:${s.color}">${valor}</span>
      ${deltaHtml}
    </div>`;
  }).join('');

  const nota = H.length < 5
    ? `<div class="chart-note">${H.length} execução(ões) registrada(s) — a tendência fica mais clara conforme o pipeline (a cada 2h) acumula pontos.</div>`
    : '';

  alvo.innerHTML = `
    <div class="hist-stamp">Instantâneo de ${horaUltimo}</div>
    <div class="hist-stats">${statsHtml}</div>
    ${lineChartSVG(H, series)}
    ${nota}`;
}

// tooltip do grafico: delegado no `document` (nao no #chartCard) porque o
// #chartCard so' existe depois que iniciar() monta o conteudo de forma
// assincrona -- ligar o listener direto nele nesse ponto do script (que
// roda antes do fetch terminar) achava null e saia em silencio, sem erro
// nenhum no console. `document` ja existe desde sempre, entao a delegacao
// funciona nao importa quando o grafico aparece. Pedido do Christian,
// 12/09/2026: uma caixa com o valor exato ao passar o mouse na bolinha.
(function () {
  document.addEventListener('mouseover', (ev) => {
    const dot = ev.target.closest('.chart-dot');
    if (!dot) return;
    const wrap = dot.closest('.chart-svg-wrap');
    const tooltip = wrap?.querySelector('#chartTooltip');
    if (!tooltip) return;
    tooltip.innerHTML = `<span class="ctt-quando">${escapeHtml(dot.dataset.quando)}</span><span class="ctt-valor" style="color:${dot.dataset.cor}">${escapeHtml(dot.dataset.label)}: ${dot.dataset.valor}</span>`;
    const rectDot = dot.getBoundingClientRect();
    const rectWrap = wrap.getBoundingClientRect();
    tooltip.style.left = (rectDot.left - rectWrap.left + rectDot.width / 2) + 'px';
    tooltip.style.top = (rectDot.top - rectWrap.top - 6) + 'px';
    tooltip.hidden = false;
  });
  document.addEventListener('mouseout', (ev) => {
    const dot = ev.target.closest('.chart-dot');
    if (!dot) return;
    const tooltip = dot.closest('.chart-svg-wrap')?.querySelector('#chartTooltip');
    if (tooltip) tooltip.hidden = true;
  });
})();

async function iniciar() {
  const el = document.getElementById('conteudo');
  let D;
  try {
    const r = await fetch('data/dados.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  } catch (e) {
    el.innerHTML = `<div class="msg-erro">Não consegui carregar os dados (${e.message}).</div>`;
    return;
  }

  DADOS_ATUAIS = D;
  const dt = new Date(D.atualizadoEm);
  document.getElementById('stamp').textContent = 'Atualizado ' + dt.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

  const totalChamadosEquip = D.equipamentos.reduce((s,e)=>s+e.chamados,0);
  const totalAlta = D.equipamentos.reduce((s,e)=>s+e.alta,0);
  const totalSOS = D.equipamentos.reduce((s,e)=>s+e.sos,0);
  const tempoMedioGeral = Math.round(D.equipamentos.reduce((s,e)=>s+e.tempoMedioDias*e.chamados,0) / (totalChamadosEquip||1));

  const kpisHtml = [
    { label: 'Total de Chamados', val: brl0(totalChamadosEquip), cls: 'k-violet' },
    { label: 'Lojas c/ Chamado Aberto', val: brl0(D.totalLojas), cls: 'k-violet' },
    { label: 'Chamados SOS', val: brl0(totalSOS), cls: 'k-sos' },
    { label: 'Chamados Alta', val: brl0(totalAlta), cls: 'k-alta' },
    { label: 'Tempo Médio (dias)', val: brl0(tempoMedioGeral), cls: 'k-violet' },
  ].map(k => `<div class="kpi ${k.cls}"><span class="label">${k.label}</span><div class="val num">${k.val}</div></div>`).join('');

  const equipOrdenados = [...D.equipamentos].sort((a, b) => b.pctIndisponibilidade - a.pctIndisponibilidade);
  const equipCards = equipOrdenados.map((e) => {
    const cor = corPorIndisponibilidade(e.pctIndisponibilidade);
    return `<div class="ecard" role="button" tabindex="0" aria-label="Ver detalhe de ${escapeHtml(e.nome)}"
        onclick="abrirModal('${e.chave}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirModal('${e.chave}');}">
      <div class="ehead"><span class="etitle">${e.nome}</span><span class="eopen">detalhe →</span></div>
      <div class="donut-row">
        <div class="donut-wrap">${donutSVG(e.pctIndisponibilidade, cor)}
          <div class="center"><span class="pctv num" style="color:${cor}">${e.pctIndisponibilidade}%</span><span class="pctl">indispon.</span></div>
        </div>
        <div class="estats">
          <div class="estat"><div class="n num">${e.pdvsEmFalha}</div><div class="l">Lojas</div></div>
          <div class="estat"><div class="n num">${e.chamados}</div><div class="l">Chamados</div></div>
          <div class="estat alta"><div class="n num">${e.alta}</div><div class="l">Alta</div></div>
          <div class="estat crit"><div class="n num">${e.sos}</div><div class="l">SOS</div></div>
        </div>
      </div>
      <div class="etime"><span>Tempo médio em aberto</span><b>${e.tempoMedioDias}d</b></div>
      ${blocoMaisUrgentes(e.chamadosMaisUrgentes)}
    </div>`;
  }).join('');

  const maxChamados = Math.max(...D.equipamentos.map(e=>e.pdvsEmFalha),1);
  const maxTempo = Math.max(...D.equipamentos.map(e=>e.tempoMedioDias),1);
  const ordPdvs = [...D.equipamentos].sort((a,b)=>b.pdvsEmFalha-a.pdvsEmFalha);
  const ordTempo = [...D.equipamentos].sort((a,b)=>b.tempoMedioDias-a.tempoMedioDias);

  const barsPdvs = ordPdvs.map(e => `<div class="hbar-row">
      <span class="lbl">${e.nome}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(e.pdvsEmFalha/maxChamados*100).toFixed(0)}%;background:linear-gradient(90deg,var(--violet-2),var(--violet))"></div></div>
      <span class="v num">${e.pdvsEmFalha}</span>
    </div>`).join('');
  const barsTempo = ordTempo.map(e => `<div class="hbar-row">
      <span class="lbl">${e.nome}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(e.tempoMedioDias/maxTempo*100).toFixed(0)}%;background:linear-gradient(90deg,var(--pink),var(--sos))"></div></div>
      <span class="v num">${e.tempoMedioDias}d</span>
    </div>`).join('');

  const supOrdenados = [...(D.supervisores || [])].sort((a, b) => b.chamados - a.chamados);
  const gaugeCards = supOrdenados.map(s => {
    const cor = corDoFarol(s.chamados);
    return `<div class="gcard" role="button" tabindex="0" aria-label="Ver detalhe de ${escapeHtml(s.nome)}"
        onclick="abrirModalSupervisor('${s.nome}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirModalSupervisor('${s.nome}');}">
      <div class="ghead">
        <div><span class="gname">${escapeHtml(s.nome)}</span><span class="gsetor">${escapeHtml((s.setores || []).join(' · '))}</span></div>
        <span class="gdetalhe">detalhe →</span>
      </div>
      <div class="ggauge">${gaugeSVG(s.chamados, FAROL_MAX, FAROL_ZONAS)}</div>
      <div class="gval"><span class="gnum num" style="color:${cor}">${s.chamados}</span><span class="glabel">chamados</span></div>
      <div class="gstats">
        <div class="estat"><div class="n num">${s.lojasComChamado}/${s.totalLojas}</div><div class="l">Lojas</div></div>
        <div class="estat alta"><div class="n num">${s.alta}</div><div class="l">Alta</div></div>
        <div class="estat crit"><div class="n num">${s.sos}</div><div class="l">SOS</div></div>
      </div>
      <div class="etime"><span>Tempo médio em aberto</span><b>${s.tempoMedioDias}d</b></div>
      ${blocoMaisUrgentes(s.chamadosDetalhe)}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="kpis">${kpisHtml}</div>

    <section>
      <div class="sec-head"><h2>Equipamentos em falha</h2><span class="sec-note">% indisponibilidade · fonte: Power BI (Disponibilidade Book · Sul)</span></div>
      <div class="equip-grid">${equipCards}</div>
    </section>

    <section>
      <div class="sec-head"><h2>Farol por supervisor</h2><span class="sec-note">Quantidade de chamados nas lojas de cada supervisor</span></div>
      <div class="gauge-grid">${gaugeCards}</div>
    </section>

    <section>
      <div class="sec-head"><h2>Buscar chamados</h2><span class="sec-note">Filtre por equipamento, loja, problema, data ou responsável</span></div>
      <div class="card">
        <div class="filter-bar">
          <div class="filter-field">
            <label for="filtroSetor">Equipamento</label>
            <select id="filtroSetor"><option value="">Todos</option></select>
          </div>
          <div class="filter-field filter-combo">
            <label for="filtroLoja">Loja</label>
            <input type="text" id="filtroLoja" placeholder="Todas" autocomplete="off">
            <div class="filter-combo-lista" id="filtroLojaLista" hidden></div>
          </div>
          <div class="filter-field">
            <label for="filtroProblema">Problema</label>
            <input type="text" id="filtroProblema" placeholder="Buscar palavra..." autocomplete="off">
          </div>
          <div class="filter-field">
            <label for="filtroResp">Responsável</label>
            <select id="filtroResp"><option value="">Todos</option></select>
          </div>
          <div class="filter-field filter-field-datas">
            <label>Abertura</label>
            <div class="filter-datas">
              <input type="date" id="filtroDataDe" title="De">
              <span>até</span>
              <input type="date" id="filtroDataAte" title="Até">
            </div>
          </div>
          <button class="filter-clear" id="filtroLimpar" type="button">Limpar filtros</button>
        </div>
        <div class="filter-count" id="filtroContagem"></div>
        <div class="filter-table-wrap">
          <table class="detail-table">
            <thead><tr><th>Número</th><th>Equipamento</th><th>Loja</th><th>Problema</th><th>Estado</th><th>Prioridade</th><th>Dias</th><th>Responsável</th></tr></thead>
            <tbody id="filtroTbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>Visão consolidada</h2></div>
      <div class="cons-grid">
        <div class="card"><h3>Lojas com chamado aberto</h3>${barsPdvs}</div>
        <div class="card"><h3>Tempo médio (dias)</h3>${barsTempo}</div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>Evolução da tratativa de chamados</h2><span class="sec-note">A cada execução (2h) · Visão Sul</span></div>
      <div class="card" id="chartCard"><div class="chart-note">carregando histórico…</div></div>
    </section>

    <footer>
      <span>Fonte: SOMA (ServiceNow) · Power BI (Disponibilidade) · Visão Sul${D.disponibilidadeBIAtualizadaEm ? ' · BI atualizado ' + escapeHtml(D.disponibilidadeBIAtualizadaEm) : ''}</span>
      <span class="mono">${brl0(D.totalRegistros)} registros · ${brl0(D.totalAbertos)} abertos</span>
    </footer>
  `;

  montarBuscaChamados(D);
  carregarHistorico();
}

function montarBuscaChamados(D) {
  const todos = D.equipamentos.flatMap(e => (e.chamadosDetalhe || []).map(c => ({ ...c, equipamento: e.nome })));

  const setores = D.equipamentos.map(e => e.nome);
  const lojas = [...new Set(todos.map(c => c.loja).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const responsaveis = [...new Set(todos.map(c => c.tecnico).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));

  const selSetor = document.getElementById('filtroSetor');
  const inLoja = document.getElementById('filtroLoja');
  const listaLoja = document.getElementById('filtroLojaLista');
  const inProblema = document.getElementById('filtroProblema');
  const selResp = document.getElementById('filtroResp');
  const inDataDe = document.getElementById('filtroDataDe');
  const inDataAte = document.getElementById('filtroDataAte');
  const tbody = document.getElementById('filtroTbody');
  const contagem = document.getElementById('filtroContagem');

  const popular = (sel, valores) => valores.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
  popular(selSetor, setores);
  popular(selResp, responsaveis);

  const semAcento = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function renderizar() {
    const fs = selSetor.value, flBusca = semAcento(inLoja.value.trim()), fr = selResp.value;
    const fpBusca = semAcento(inProblema.value.trim());
    const dataDe = inDataDe.value, dataAte = inDataAte.value;
    const filtrados = ordenaChamados(
      todos.filter(c =>
        (!fs || c.equipamento === fs)
        && (!flBusca || semAcento(c.loja).includes(flBusca))
        && (!fpBusca || semAcento(c.problema).includes(fpBusca))
        && (!fr || c.tecnico === fr)
        && (!dataDe || (c.abertura && c.abertura >= dataDe))
        && (!dataAte || (c.abertura && c.abertura <= dataAte))
      )
    );

    contagem.textContent = `${filtrados.length} de ${todos.length} chamados`;
    tbody.innerHTML = filtrados.length
      ? filtrados.map(c => `<tr>
          <td class="mono">${escapeHtml(c.numero)}</td>
          <td>${escapeHtml(c.equipamento)}</td>
          <td>${escapeHtml(c.loja)}</td>
          <td>${escapeHtml(c.problema) || '—'}</td>
          <td>${escapeHtml(c.estado)}</td>
          <td><span class="tag ${tagClsPrioridade(c.prioridade)}">${escapeHtml(c.prioridade)}</span></td>
          <td class="num">${c.dias}d</td>
          <td>${escapeHtml(c.tecnico) || '—'}</td>
        </tr>`).join('')
      : `<tr><td colspan="8"><div class="filter-empty">Nenhum chamado com esses filtros.</div></td></tr>`;
  }

  // combobox de loja: digita e filtra a lista; clicar numa opcao preenche
  // o campo. O filtro da tabela ja' e' por trecho (nao precisa clicar pra
  // filtrar, so' ajuda a achar o nome certo).
  function mostrarListaLoja() {
    const busca = semAcento(inLoja.value.trim());
    const opcoes = (busca ? lojas.filter(l => semAcento(l).includes(busca)) : lojas).slice(0, 40);
    listaLoja.innerHTML = opcoes.length
      ? opcoes.map(l => `<div class="filter-combo-item">${escapeHtml(l)}</div>`).join('')
      : `<div class="filter-combo-vazio">Nenhuma loja encontrada</div>`;
    listaLoja.hidden = false;
  }
  inLoja.addEventListener('input', () => { mostrarListaLoja(); renderizar(); });
  inLoja.addEventListener('focus', mostrarListaLoja);
  listaLoja.addEventListener('mousedown', (ev) => {
    const item = ev.target.closest('.filter-combo-item');
    if (!item) return;
    ev.preventDefault();
    inLoja.value = item.textContent;
    listaLoja.hidden = true;
    renderizar();
  });
  document.addEventListener('click', (ev) => {
    if (ev.target !== inLoja && !listaLoja.contains(ev.target)) listaLoja.hidden = true;
  });

  [selSetor, selResp].forEach(sel => sel.addEventListener('change', renderizar));
  inProblema.addEventListener('input', renderizar);
  [inDataDe, inDataAte].forEach(el => el.addEventListener('change', renderizar));
  document.getElementById('filtroLimpar').addEventListener('click', () => {
    selSetor.value = ''; inLoja.value = ''; inProblema.value = ''; selResp.value = '';
    inDataDe.value = ''; inDataAte.value = '';
    listaLoja.hidden = true;
    renderizar();
  });

  renderizar();
}
iniciar();

// menu lateral recolhivel -- lembra a preferencia do usuario
(function () {
  const shell = document.querySelector('.shell');
  const CHAVE = 'chamados_sidebar_collapsed';
  function aplicar(colapsado) {
    shell.classList.toggle('sb-collapsed', colapsado);
    shell.classList.toggle('sb-expanded', !colapsado);
  }
  let salvo = null;
  try { salvo = localStorage.getItem(CHAVE); } catch (e) {}
  // sem preferencia salva ainda: comeca recolhido em telas estreitas (a aba
  // de 240px nao cabe num celular), expandido em telas largas
  const colapsado = salvo === null ? window.innerWidth <= 860 : salvo === '1';
  aplicar(colapsado);

  document.getElementById('sideToggle').addEventListener('click', () => {
    aplicar(true);
    try { localStorage.setItem(CHAVE, '1'); } catch (e) {}
  });
  document.getElementById('sideReopen').addEventListener('click', () => {
    aplicar(false);
    try { localStorage.setItem(CHAVE, '0'); } catch (e) {}
  });
})();
</script>
